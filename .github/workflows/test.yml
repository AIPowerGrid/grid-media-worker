name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install locked test dependencies
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --frozen --extra test

      - name: Reject retired transports
        shell: bash
        run: |
          if git grep -nEi 'AI[ -]?Horde|/api/v2|/v2/generate|GRID_WS=' -- . \
            ':(exclude).github/workflows/test.yml'; then
            echo "::error::retired transport reference found above"
            exit 1
          fi

      - name: Run test suite
        run: uv run --frozen --extra test pytest tests/ -v --tb=short

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Export the complete locked dependency graph
        run: >-
          uv export --frozen --all-extras --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/media-worker-all-deps.txt

      - name: Audit locked dependencies
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit
          -r /tmp/media-worker-all-deps.txt --require-hashes --disable-pip
